services:
  postgres:
    image: postgres:16-alpine
    container_name: accessibility-postgres

    environment:
      POSTGRES_DB: accessibility_db
      POSTGRES_USER: accessibility_user
      POSTGRES_PASSWORD: accessibility_dev_password

    volumes:
      - accessibility_postgres_data:/var/lib/postgresql/data

    ports:
      - "55432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U accessibility_user -d accessibility_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile

    container_name: pathsense-backend

    environment:
      DATABASE_URL: postgresql+psycopg://accessibility_user:accessibility_dev_password@postgres:5432/accessibility_db

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - accessibility_uploads:/app/backend/uploads

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/v1/health"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""

    container_name: pathsense-frontend

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"

volumes:
  accessibility_postgres_data:
  accessibility_uploads:
